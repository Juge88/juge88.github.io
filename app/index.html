<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161618">
<title>Bench</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <button id="backBtn" class="icon" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 id="title">Pieces</h1>
  <div id="topActions"></div>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="pieces" class="on"><span class="pill"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span>Pieces</span></button>
  <button data-tab="gallery"><span class="pill"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></span><span>Gallery</span></button>
  <button data-tab="catalog"><span class="pill"><svg viewBox="0 0 24 24"><path d="M7 3c-2 4-2 7 0 9s2 6 0 9M17 3c2 4 2 7 0 9s-2 6 0 9"/></svg></span><span>Catalog</span></button>
  <button data-tab="woods"><span class="pill"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="4" height="18" rx="1.5"/><rect x="10" y="3" width="4" height="18" rx="1.5"/><rect x="16" y="3" width="4" height="18" rx="1.5"/></svg></span><span>Woods</span></button>
  <button data-tab="settings"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span><span>Settings</span></button>
</nav>
<div id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" hidden></div>
<input type="file" id="filePick" hidden>
<script src="qrcode.js"></script>
<script src="geom.js"></script>
<script src="shapes.js"></script>
<script src="grain.js"></script>
<script src="draw.js"></script>
<script src="bowl.js"></script>
<script src="boards.js"></script>
<script src="clipper.js"></script>
<script src="three.min.js"></script>
<script src="view3d.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
