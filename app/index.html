<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f3ef">
<title>Bench</title>
<script>
// Pick light or dark before the first paint, so the app never flashes the wrong colors
try {
  var t = (JSON.parse(localStorage.getItem('bench.v1') || '{}').settings || {}).theme || 'auto';
  var sys = window.Android && Android.systemDark ? Android.systemDark() : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = t === 'dark' || (t === 'auto' && sys) ? 'dark' : 'light';
} catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <button id="backBtn" class="icon" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 id="title">Pieces</h1>
  <div id="topActions"></div>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="pieces" class="on"><span class="pill"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="4.5" rx="1.6"/><rect x="3.5" y="14.5" width="17" height="4.5" rx="1.6"/></svg></span><span>Pieces</span></button>
  <button data-tab="gallery"><span class="pill"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></span><span>Gallery</span></button>
  <button data-tab="catalog"><span class="pill"><svg viewBox="0 0 24 24"><path d="M8 3.5c-1.7 3-1.7 5.6 0 8.5s1.7 5.5 0 8.5"/><path d="M16 3.5c1.7 3 1.7 5.6 0 8.5s-1.7 5.5 0 8.5"/><path d="M8 12h8" stroke-dasharray="2 2.2"/></svg></span><span>Catalog</span></button>
  <button data-tab="woods"><span class="pill"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="4" height="17" rx="1.4"/><rect x="10" y="3.5" width="4" height="17" rx="1.4"/><rect x="16" y="3.5" width="4" height="17" rx="1.4"/></svg></span><span>Woods</span></button>
  <button data-tab="shop"><span class="pill"><svg viewBox="0 0 24 24"><path d="M4 9.5l1.6-5h12.8L20 9.5"/><path d="M4 9.5c0 1.5 1.2 2.5 2.7 2.5s2.6-1 2.6-2.5c0 1.5 1.2 2.5 2.7 2.5s2.7-1 2.7-2.5c0 1.5 1.1 2.5 2.6 2.5S20 11 20 9.5"/><path d="M5.5 12v7.5h13V12"/><path d="M10 19.5v-4.5h4v4.5"/></svg></span><span>Shop</span></button>
</nav>
<div id="sheet" hidden><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" hidden></div>
<input type="file" id="filePick" hidden>
<script src="qrcode.js"></script>
<script src="geom.js"></script>
<script src="shapes.js"></script>
<script src="grain.js"></script>
<script src="draw.js"></script>
<script src="bowl.js"></script>
<script src="boards.js"></script>
<script src="clipper.js"></script>
<script src="three.min.js"></script>
<script src="view3d.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
