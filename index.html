  :root { --paper: #fbf7f1; --ink: #2a211b; --dim: #7a6a5c; --line: #e6dccf; --accent: #9a5b2c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 18px/1.7 Fraunces, Georgia, "Noto Serif", "Times New Roman", serif; font-variation-settings: 'SOFT' 50, 'opsz' 14; -webkit-font-smoothing: antialiased; }
  .band { display: flex; height: 18px; }
  .band i { flex: 1; }
  main { max-width: 640px; margin: 0 auto; padding: 36px 22px 60px; }
  .by { font: 600 13px/1 system-ui, -apple-system, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  h1 { font-size: 40px; line-height: 1.1; margin: 14px 0 6px; font-weight: 600; font-variation-settings: 'SOFT' 100, 'opsz' 72; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: 17px; margin: 0; }
  .woods { margin: 28px 0 8px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: #fff8; }
  .woods .lab { font: 600 12px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 12px; }
  .strip { display: flex; height: 64px; border-radius: 10px; overflow: hidden; box-shadow: inset 0 0 0 1px #0002; }
  .strip i { flex: 1; position: relative; }
  .strip i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #fff3, transparent 40%, #0002); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font: 15px system-ui, sans-serif; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend b { width: 14px; height: 14px; border-radius: 4px; display: inline-block; box-shadow: inset 0 0 0 1px #0003; }
  .story p { margin: 0 0 1.1em; }
  .story p.care { font: 16px/1.6 system-ui, sans-serif; color: #4a3b30; background: #f3ebe0; border-radius: 12px; padding: 14px 16px; }
  .story p.sign { font-style: italic; }
  .foot { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--dim); font: 14px system-ui, sans-serif; text-align: center; }
  .art { margin: 26px -6px 0; padding: 22px 10px; border-radius: 22px; background: radial-gradient(130% 100% at 50% 0%, #2b2b30, #1a1a1d 70%); }
  .art svg { display: block; width: 100%; height: auto; max-height: 340px; }
  .logo { display: block; width: min(280px, 70%); height: auto; margin: 0 0 4px; }
  .err { text-align: center; padding: 80px 20px; color: var(--dim); }
  .appback { display: none; position: fixed; top: 12px; left: 12px; padding: 8px 14px; border-radius: 10px; background: #2a211bdd; color: #fff; font: 600 14px system-ui, sans-serif; border: 0; }

<main id="m"><div class="err">Loading…</div></main>
<script>
'use strict';
/* Template geometry: read STL plates, find the outline, holes, punch marks and the dovetail,
   and work out how two parts mate. Shared by the app and the build tools (Node). */

const G = (() => {
  /* ---------- STL ---------- */
  function parseSTL(buf) {
    const u8 = new Uint8Array(buf);
    const head = new TextDecoder().decode(u8.slice(0, 256));
    const dv = new DataView(buf);
    const n = buf.byteLength >= 84 ? dv.getUint32(80, true) : 0;
    const isBinary = buf.byteLength === 84 + n * 50 || !/^\s*solid[\s\S]*facet/.test(head);
    let tris;
    if (isBinary) {
      tris = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) for (let k = 0; k < 9; k++) tris[i * 9 + k] = dv.getFloat32(84 + i * 50 + 12 + k * 4, true);
    } else {
      const txt = new TextDecoder().decode(u8);
      const v = [...txt.matchAll(/vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g)].map(m => [+m[1], +m[2], +m[3]]);
      tris = new Float32Array(v.length * 3);
      v.forEach((p, i) => tris.set(p, i * 3));
    }
    return tris;
  }
  // Cross-section loops at height z above the bottom of the plate
  function slice(tris, dz = 0.3) {
    let zmin = Infinity;
    for (let i = 2; i < tris.length; i += 3) zmin = Math.min(zmin, tris[i]);
    const z = zmin + dz, segs = [];
    for (let t = 0; t < tris.length; t += 9) {
      const P = [[tris[t], tris[t + 1], tris[t + 2]], [tris[t + 3], tris[t + 4], tris[t + 5]], [tris[t + 6], tris[t + 7], tris[t + 8]]];
      const pts = [];
      for (let e = 0; e < 3; e++) {
        const a = P[e], b = P[(e + 1) % 3];
        if ((a[2] - z) * (b[2] - z) < 0) { const k = (z - a[2]) / (b[2] - a[2]); pts.push([a[0] + k * (b[0] - a[0]), a[1] + k * (b[1] - a[1])]); }
      }
      if (pts.length === 2) segs.push(pts);
    }
    // chain segments into loops
    const key = p => Math.round(p[0] * 1e4) + ',' + Math.round(p[1] * 1e4);
    const at = new Map();
    segs.forEach((s, i) => { for (const p of s) { const k = key(p); if (!at.has(k)) at.set(k, []); at.get(k).push(i); } });
    const used = new Uint8Array(segs.length), loops = [];
    for (let i = 0; i < segs.length; i++) {
      if (used[i]) continue;
      used[i] = 1; const loop = [segs[i][0], segs[i][1]];
      let cur = segs[i][1];
      for (let guard = 0; guard < segs.length; guard++) {
        const cand = (at.get(key(cur)) || []).find(j => !used[j]);
        if (cand == null) break;
        used[cand] = 1;
        const s = segs[cand]; const nxt = key(s[0]) === key(cur) ? s[1] : s[0];
        if (key(nxt) === key(loop[0])) break;
        loop.push(nxt); cur = nxt;
      }
      if (loop.length > 3) loops.push(loop);
    }
    return loops;
  }

  /* ---------- polygon helpers ---------- */
  const area = L => { let a = 0; for (let i = 0, j = L.length - 1; i < L.length; j = i++) a += (L[j][0] + L[i][0]) * (L[j][1] - L[i][1]); return a / 2; };
  const centroid = L => { let x = 0, y = 0, a = 0; for (let i = 0, j = L.length - 1; i < L.length; j = i++) { const f = L[j][0] * L[i][1] - L[i][0] * L[j][1]; x += (L[j][0] + L[i][0]) * f; y += (L[j][1] + L[i][1]) * f; a += f; } return [x / (3 * a), y / (3 * a)]; };
  function inside(L, p) {
    let c = false;
    for (let i = 0, j = L.length - 1; i < L.length; j = i++) {
      const [xi, yi] = L[i], [xj, yj] = L[j];
      if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  function rdp(L, eps) {
    if (L.length < 4) return L;
    const out = []; const keep = new Uint8Array(L.length); keep[0] = keep[L.length - 1] = 1;
    const st = [[0, L.length - 1]];
    while (st.length) {
      const [a, b] = st.pop(); let md = 0, mi = -1;
      const [x1, y1] = L[a], [x2, y2] = L[b], dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1e-9;
      for (let i = a + 1; i < b; i++) { const d = Math.abs(dy * L[i][0] - dx * L[i][1] + x2 * y1 - y2 * x1) / len; if (d > md) { md = d; mi = i; } }
      if (md > eps) { keep[mi] = 1; st.push([a, mi], [mi, b]); }
    }
    L.forEach((p, i) => keep[i] && out.push(p));
    return out;
  }
  const pathD = L => 'M' + L.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + 'Z';

  /* ---------- dovetail ---------- */
  // Both the tail tip and the socket bottom are a straight ~16 mm edge. Tell them apart by probing around it.
  function findJoint(L) {
    const n = L.length, segs = [];
    let start = 0;
    const dir = i => { const a = L[i], b = L[(i + 1) % n]; return Math.atan2(b[1] - a[1], b[0] - a[0]); };
    const edges = [...Array(n).keys()];
    // merge nearly collinear consecutive edges
    let i = 0;
    while (i < n) {
      let j = i, d0 = dir(i), len = 0;
      while (j < i + n) {
        const dj = dir(j % n); let diff = Math.abs(dj - d0); if (diff > Math.PI) diff = 2 * Math.PI - diff;
        if (diff > 0.05) break;
        const a = L[j % n], b = L[(j + 1) % n]; len += Math.hypot(b[0] - a[0], b[1] - a[1]); j++;
      }
      if (j === i) j = i + 1;
      segs.push({ a: L[i % n], b: L[j % n], len });
      i = j;
    }
    const found = [];
    for (const s of segs) {
      if (s.len < 14 || s.len > 18.5) continue;
      const m = [(s.a[0] + s.b[0]) / 2, (s.a[1] + s.b[1]) / 2];
      const u = [(s.b[0] - s.a[0]) / s.len, (s.b[1] - s.a[1]) / s.len];
      let nrm = [-u[1], u[0]];
      if (inside(L, [m[0] + nrm[0] * 0.4, m[1] + nrm[1] * 0.4])) nrm = [-nrm[0], -nrm[1]];   // point out of the material
      const P = (along, lat) => [m[0] + nrm[0] * along + u[0] * lat, m[1] + nrm[1] * along + u[1] * lat];
      const In = p => inside(L, p);
      const tail = In(P(-4.5, 0)) && In(P(-12, 0)) && !In(P(-7, 7.6)) && !In(P(-7, -7.6));
      const socket = !In(P(4.5, 0)) && In(P(2, 9.6)) && In(P(2, -9.6)) && In(P(7, 7.4)) && In(P(7, -7.4));
      if (tail || socket) found.push({ kind: tail ? 'tail' : 'socket', m, n: nrm });
    }
    return found.length ? found[0] : null;
  }
  // Transform to apply to the socket part so it wraps the tail part's tail. Returns [a,b,c,d,e,f] (SVG matrix).
  function mateMatrix(socketJ, tailJ, back = 0.1) {
    // rotate socket normal onto the opposite of the tail normal, then move bottom-mid onto tip-mid
    const ang = Math.atan2(-tailJ.n[1], -tailJ.n[0]) - Math.atan2(socketJ.n[1], socketJ.n[0]);
    const c = Math.cos(ang), s = Math.sin(ang);
    const [sx, sy] = socketJ.m, [tx, ty] = tailJ.m;
    return [c, s, -s, c, tx - tailJ.n[0] * back - (c * sx - s * sy), ty - tailJ.n[1] * back - (s * sx + c * sy)];

<script>
'use strict';
/* Wood figure for the drawings: each species gets its own grain style (stripes, ribbon, fleck, curl,
   birdseye, spalting, burl, open pores). Drawn in a local frame where the grain runs along x. */

const GR = (() => {
  // Species -> grain style. Anything not listed gets plain straight grain.
  const STYLE = {
    stripe: ['zebrawood', 'macassar-ebony', 'tigerwood', 'goncalo', 'marblewood', 'ovangkol', 'limba', 'bocote', 'ziricote', 'cocobolo', 'kingwood', 'tulipwood-br', 'rosewood', 'pau-ferro', 'granadillo', 'white-ash-olive', 'wenge', 'bubinga', 'honduran-rosewood', 'canarywood', 'curupay', 'mopane'],
    ribbon: ['sapele', 'sapele-quartered', 'khaya', 'sipo', 'makore', 'anigre', 'avodire', 'santos-mahogany', 'honduran-mahogany', 'mahogany', 'afzelia', 'muninga', 'narra', 'padauk', 'jatoba'],
    fleck: ['lacewood', 'leopardwood', 'oak-quartersawn', 'sycamore', 'snakewood', 'bocote-black', 'beech'],
    curl: ['curly-maple', 'quilted-maple', 'koa'],
    birdseye: ['birdseye'],
    spalt: ['spalted-maple', 'cherry-spalted', 'tamarind', 'ambrosia-maple', 'mango', 'olive', 'box-elder'],
    burl: ['walnut-burl', 'maple-burl', 'buckeye-burl'],
    pores: ['oak-white', 'oak-red', 'oak-english', 'oak-live', 'ash', 'hickory', 'pecan', 'hickory-pecan', 'elm', 'red-elm', 'chestnut', 'catalpa', 'sassafras', 'iroko', 'teak', 'cumaru', 'ipe', 'douglas-fir', 'pine']
  };
  const BY_ID = {};

        const bw = { kind: q.k, shape: q.s, D: q.D, H: q.H, ringH: q.rh, wall: q.wl, base: 'i' + parseInt(q.b || '0', 36), wood: 'i' + parseInt(q.w || '0', 36),
          rings: (q.r || []).map(([off, rows]) => { const rs = rows.split('|').map(row => row.split('').map(c => 'i' + parseInt(c, 36))); return { n: rs[0].length, off: !!off, rows: rs, woods: [] }; }) };
        art = B.side(bw, ci);
      } else if (d.bd && typeof BD !== 'undefined') {
        const ci = k => cols[parseInt(String(k).slice(1), 10)] || { color: '#c9a57a' };
        art = BD.draw(BD.unpack(d.bd, i => 'i' + parseInt(i, 36)), ci, d.bd.ds || d.bd.sd || 1);
      } else if (d.b) art = D.board(d.b[0], d.b[1], d.b[2], cols.length ? cols : [{ color: '#c9a57a' }], d.b[3]);
    } catch (e) {}
    const paras = unpackStory(d.s || '').split(/\n{2,}/).map(p => {
      const cls = /^Care:/i.test(p) ? 'care' : /^—|\n—/.test(p) || /^Thank you/.test(p) ? 'sign' : '';
      return `<p class="${cls}">${esc(p).replace(/\n/g, '<br>')}</p>`;
    }).join('');
    m.innerHTML = `
      ${logo ? `<img class="logo" src="${esc(logo)}" alt="${esc(d.sh || d.m || '')}">` : `<div class="by">${esc(d.sh || (d.m ? 'Made by ' + d.m : 'Handmade'))}</div>`}
      <h1>${esc(d.t)} No. ${no}</h1>
      <p class="sub">${esc([d.d, d.f && d.f !== 'Unfinished' ? 'Finished with ' + d.f : ''].filter(Boolean).join(' · '))}</p>
      ${art ? `<div class="art">${art}</div>` : ''}
      ${ws.length ? `<div class="woods"><div class="lab">${d.bw || d.bd || (d.b && d.b[0] !== 'edge') ? 'Woods' : ws.length > 1 ? ws.length + ' strips, left to right' : 'Wood'}</div>
        <div class="strip">${ws.map((w, i) => `<i style="background:${esc(w[1])};flex:${d.sw ? +d.sw[i] || 1 : 1}" title="${esc(w[0])}"></i>`).join('')}</div>
        <div class="legend">${uniq.map(w => `<span><b style="background:${esc(w[1])}"></b>${esc(w[0])}</span>`).join('')}</div></div>` : ''}
      <div class="story">${paras}</div>
      <div class="foot">No. ${no} · one of a kind</div>`;
  } catch (e) {
    m.innerHTML = e.message === 'soon' ? '<div class="err">This story is on its way. Give it a minute and scan again.</div>' : '<div class="err">This link is missing its details. Try scanning the tag again.</div>';
  }
})();
</script>
